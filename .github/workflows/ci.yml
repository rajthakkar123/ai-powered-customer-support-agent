name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dev requirements
        run: python -m pip install -r backend/requirements-dev.txt
      # Tests use fakes and evals are offline, so CI needs no OpenAI key or other secret.
      - name: Run quality gate (bash)
        if: runner.os != 'Windows'
        run: bash backend/scripts/check.sh
      - name: Run quality gate (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./backend/scripts/check.ps1
