[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Backend-first, policy-grounded customer support agent"
requires-python = ">=3.11"
dependencies = ["python-dotenv==1.2.4"]

[project.optional-dependencies]
dev = ["coverage==7.17.2", "mypy==2.4.1", "ruff==0.17.3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F errors, I imports, UP modern syntax, B bugbear, S security, SIM simplifications,
# C4 comprehensions, RUF ruff-specific, T20 stray prints in the application package.
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4", "RUF", "T20"]
ignore = [
    "S101",    # assert is used for invariants in fixtures and tests
    "RUF001",  # typographic characters appear in user-facing copy on purpose
    "RUF012",  # class-level constant tuples/dicts are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "S310"]  # fake credentials, local test URLs
"scripts/*" = ["T20", "S603"]         # CLI scripts print results and invoke pip
"support_agent/__main__.py" = ["T20"]  # prints the one-time admin password banner
"support_agent/security/accounts.py" = ["T20"]  # password-reset CLI output
"support_agent/infrastructure/database.py" = ["T20"]  # schema/sample-data sync CLI output

[tool.mypy]
python_version = "3.11"
files = ["support_agent"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["support_agent"]
branch = true
# The composition root loads backend/.env on import, so tests never import it; it only wires
# objects that are each covered, and the launchers exercise it on every start.
omit = ["support_agent/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
